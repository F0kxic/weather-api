<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>ООО Модуль — Авторизация</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Oswald:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="nav-brand" style="justify-content:center; margin-bottom:2rem;">
                <span class="logo-main">МОДУЛЬ</span>
                <span class="logo-sub">ООО</span>
            </div>
            <div class="auth-tabs">
                <button id="tabLogin" class="tab-btn active" onclick="switchTab('login')">Вход</button>
                <button id="tabRegister" class="tab-btn" onclick="switchTab('register')">Регистрация</button>
            </div>

            <form id="loginForm" class="auth-form">
                <h2>Вход</h2>
                <div class="form-group">
                    <label>Логин</label>
                    <input type="text" id="loginUsername" required placeholder="Введите логин">
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="loginPassword" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-primary btn-block">Войти</button>
            </form>

            <form id="registerForm" class="auth-form hidden">
                <h2>Регистрация</h2>
                <div class="form-group">
                    <label>Логин</label>
                    <input type="text" id="regUsername" required placeholder="Придумайте логин">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="regEmail" required placeholder="example@mail.ru">
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="regPassword" required placeholder="Минимум 6 символов">
                </div>
                <div class="form-group">
                    <label>ФИО</label>
                    <input type="text" id="regFullName" placeholder="Иванов Иван Иванович">
                </div>
                <div class="form-group">
                    <label>Телефон</label>
                    <input type="tel" id="regPhone" placeholder="+7 (999) 000-00-00">
                </div>
                <button type="submit" class="btn-primary btn-block">Создать аккаунт</button>
            </form>

            <p class="back-home"><a href="index.html">← На главную</a></p>
        </div>
    </div>

    <script src="app.js?v=4"></script>
    <script>
        function switchTab(type) {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const tabLogin = document.getElementById('tabLogin');
            const tabRegister = document.getElementById('tabRegister');
            if (type === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                tabLogin.classList.add('active');
                tabRegister.classList.remove('active');
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                tabLogin.classList.remove('active');
                tabRegister.classList.add('active');
            }
        }
        document.getElementById('loginForm').addEventListener('submit', (e) => { e.preventDefault(); app.handleLogin(); });
        document.getElementById('registerForm').addEventListener('submit', (e) => { e.preventDefault(); app.handleRegister(); });
    </script>
</body>
</html>
